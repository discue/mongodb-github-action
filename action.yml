name: 'MongoDB for GitHub Actions'
description: 'Start a MongoDB server or replica set with configurable options'

branding:
  icon: 'database'
  color: 'green'

inputs:
  mongodb-version:
    description: 'MongoDB version to use (e.g. "7.0", "8.0", "latest")'
    required: false
    default: 'latest'

  mongodb-replica-set:
    description: 'MongoDB replica set name (no replica set by default)'
    required: false
    default: ''

  mongodb-port:
    description: 'MongoDB port to expose (default 27017)'
    required: false
    default: '27017'

  mongodb-root-username:
    description: 'MongoDB root username (default empty)'
    required: false
    default: ''

  mongodb-root-password:
    description: 'MongoDB root password (default empty)'
    required: false
    default: ''

  mongodb-db:
    description: 'MongoDB database name to initialize (default empty)'
    required: false
    default: ''

  container-name:
    description: 'Docker container name (default "mongodb")'
    required: false
    default: 'mongodb'

  connection-timeout:
    description: 'Timeout in seconds to wait for MongoDB to accept connections (default 30)'
    required: false
    default: '30'

outputs:
  connection-string:
    description: 'MongoDB connection string URI'
    value: ${{ steps.start-mongodb.outputs.connection-string }}
  port:
    description: 'MongoDB port'
    value: ${{ inputs.mongodb-port }}
  replica-set:
    description: 'MongoDB replica set name (if configured)'
    value: ${{ inputs.mongodb-replica-set }}
  container-name:
    description: 'Docker container name'
    value: ${{ inputs.container-name }}

runs:
  using: 'composite'
  steps:
    - id: start-mongodb
      shell: bash
      env:
        MONGODB_VERSION: ${{ inputs.mongodb-version }}
        MONGODB_REPLICA_SET: ${{ inputs.mongodb-replica-set }}
        MONGODB_PORT: ${{ inputs.mongodb-port }}
        MONGODB_ROOT_USERNAME: ${{ inputs.mongodb-root-username }}
        MONGODB_ROOT_PASSWORD: ${{ inputs.mongodb-root-password }}
        MONGODB_DB: ${{ inputs.mongodb-db }}
        CONTAINER_NAME: ${{ inputs.container-name }}
        CONNECTION_TIMEOUT: ${{ inputs.connection-timeout }}
        GITHUB_ACTION_PATH: ${{ github.action_path }}
      run: |
        "${GITHUB_ACTION_PATH}/start-mongodb.sh"
